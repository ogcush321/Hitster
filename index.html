<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5x5 Color Tile Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; -webkit-user-select: none; }
    body { background-color: #1e1e24; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 15px; }
    h1 { font-size: 1.5rem; margin-bottom: 12px; }
    .notes-container { width: 100%; max-width: 380px; margin-bottom: 16px; }
    textarea { width: 100%; height: 70px; padding: 10px 12px; border-radius: 10px; border: 2px solid #3a3a48; background-color: #2b2b36; color: #ffffff; font-size: 1rem; resize: none; user-select: text; -webkit-user-select: text; }
    textarea:focus { outline: none; border-color: #6c5ce7; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 380px; aspect-ratio: 1 / 1; margin-bottom: 20px; }
    .tile { border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; font-weight: 900; color: rgba(0, 0, 0, 0.75); cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent; }
    .tile:active { transform: scale(0.93); }
    .tile.marked::after { content: "X"; }
    .green { background-color: #2ecc71; }
    .purple { background-color: #9b59b6; }
    .pink { background-color: #fd79a8; }
    .blue { background-color: #3498db; }
    .yellow { background-color: #f1c40f; }
    .reset-btn { width: 100%; max-width: 380px; padding: 14px; font-size: 1.1rem; font-weight: 700; color: #ffffff; background-color: #e74c3c; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent; }
    .reset-btn:active { transform: scale(0.97); background-color: #c0392b; }
    
    #win-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); color: #ffd700;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      font-size: 4rem; text-align: center; font-weight: bold; z-index: 100;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  
  <div id="win-overlay">מנצח!<br><span id="win-name"></span></div>

  <h1 id="player-title">Tile Board</h1>
  <div class="notes-container">
    <textarea id="playerNotes" placeholder="Write your text here..."></textarea>
  </div>
  <div class="grid" id="board"></div>
  <button class="reset-btn" id="resetBtn">Reset & Shuffle Board</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBnZ9IdBR3TUiK2GhEPQEe05CuNhAlr-10",
      authDomain: "hitster-9c20e.firebaseapp.com",
      databaseURL: "https://hitster-9c20e-default-rtdb.firebaseio.com",
      projectId: "hitster-9c20e",
      storageBucket: "hitster-9c20e.firebasestorage.app",
      messagingSenderId: "147718395836",
      appId: "1:147718395836:web:75a3a01abc22620866bdb9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const colors = ['green', 'purple', 'pink', 'blue', 'yellow'];
    const board = document.getElementById('board');
    let playerName = "";
    let markedCount = 0;
    const loadTime = Date.now();

    playerName = prompt("What is your name?", "") || "Player";
    document.getElementById('player-title').innerText = playerName + "'s Board";
    initBoard();

    function generateColorPool() {
      let pool = [];
      colors.forEach(c => { for (let i = 0; i < 5; i++) pool.push(c); });
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      return pool;
    }

    function initBoard() {
      board.innerHTML = '';
      markedCount = 0;
      generateColorPool().forEach(color => {
        const tile = document.createElement('div');
        tile.className = `tile ${color}`;
        tile.addEventListener('click', () => handleTileClick(tile));
        board.appendChild(tile);
      });
    }

    function handleTileClick(tile) {
      if (tile.classList.contains('marked')) {
        tile.classList.remove('marked');
        markedCount--;
      } else {
        tile.classList.add('marked');
        markedCount++;
        if (markedCount === 5) {
          set(ref(db, 'latestWinner'), {
            name: playerName,
            timestamp: Date.now()
          });
        }
      }
    }

    const winnerRef = ref(db, 'latestWinner');
    onValue(winnerRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.timestamp > loadTime) {
        showWin(data.name);
      }
    });

    function showWin(winnerName) {
      const overlay = document.getElementById('win-overlay');
      document.getElementById('win-name').innerText = winnerName;
      overlay.style.display = 'flex';
      setTimeout(() => { overlay.style.display = 'none'; }, 3000);
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm("Are you sure you want to reset the board?")) {
        initBoard();
      }
    });
  </script>
</body>
</html>
